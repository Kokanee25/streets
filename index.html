<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f1115">
<title>Streetwise</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root { --bg:#0f1115; --card:rgba(18,21,28,.92); --fg:#f2f4f8; --dim:#9aa3b2; --accent:#ffb020; --ok:#3ddc84; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; overflow:hidden; }
  #map { position:absolute; inset:0; }
  .card { position:absolute; left:12px; right:12px; z-index:1000; background:var(--card);
    border-radius:16px; padding:12px 16px; box-shadow:0 6px 24px rgba(0,0,0,.4); backdrop-filter:blur(6px); }
  #top { top:calc(12px + env(safe-area-inset-top)); padding:14px 18px; }
  #dirRow { display:flex; align-items:baseline; gap:10px; padding-bottom:10px; border-bottom:1px solid #2a2f3a; }
  #dir { font-size:44px; font-weight:800; line-height:1; color:#7fb2ff; }
  #dirWord { font-size:15px; color:var(--dim); text-transform:uppercase; letter-spacing:.08em; flex:1; }
  #speedBox { font-size:14px; color:var(--dim); cursor:pointer; white-space:nowrap; }
  #speed { font-size:20px; font-weight:700; color:var(--fg); font-variant-numeric:tabular-nums; }
  .section { padding:10px 0; border-bottom:1px solid #2a2f3a; }
  .label { font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--dim); }
  #street { font-size:30px; font-weight:700; line-height:1.15; margin-top:2px; }
  #next { font-size:30px; font-weight:700; line-height:1.15; margin-top:2px; color:var(--accent); }
  #nextDist { font-size:17px; color:var(--dim); margin-top:2px; font-variant-numeric:tabular-nums; }
  #status { font-size:12px; color:var(--dim); margin-top:8px; }
  #streetSub { font-size:20px; font-weight:700; color:#cfd5e0; margin-top:2px; }
  #streetSub:empty { display:none; }
  .btn.left { left:12px; right:auto; }
  #nightBtn { bottom:calc(20px + env(safe-area-inset-bottom)); }
  #memosBtn { bottom:calc(70px + env(safe-area-inset-bottom)); }
  #memoBtn { position:absolute; z-index:1000; left:50%; transform:translateX(-50%); bottom:calc(16px + env(safe-area-inset-bottom));
    background:#d93636; color:#fff; border:0; border-radius:40px; padding:16px 26px; font-size:19px; font-weight:800;
    box-shadow:0 6px 20px rgba(0,0,0,.45); white-space:nowrap; }
  #memoBtn.rec { background:#fff; color:#d93636; animation:pulse 1.2s infinite; }
  @keyframes pulse { 50% { box-shadow:0 0 0 10px rgba(217,54,54,.35); } }
  #callerBtn { position:absolute; z-index:1000; left:50%; transform:translateX(-50%); bottom:calc(84px + env(safe-area-inset-bottom));
    background:var(--card); color:var(--fg); border:1px solid #3a4150; border-radius:20px; padding:8px 14px; font-size:15px; font-weight:700; white-space:nowrap; }
  #recLive { position:absolute; z-index:1000; left:12px; right:12px; bottom:calc(132px + env(safe-area-inset-bottom));
    background:var(--card); border-radius:12px; padding:10px 12px; font-size:16px; display:none; }
  #recLive.on { display:block; }
  #memoPanel { position:absolute; left:8px; right:8px; top:calc(8px + env(safe-area-inset-top)); bottom:calc(8px + env(safe-area-inset-bottom));
    z-index:1500; background:#14171d; border-radius:16px; box-shadow:0 6px 24px rgba(0,0,0,.6); display:none; flex-direction:column; }
  #memoPanel.open { display:flex; }
  .mpHead { display:flex; align-items:center; gap:8px; padding:12px 14px; border-bottom:1px solid #2a2f3a; }
  .mpHead b { flex:1; font-size:18px; }
  .mpHead button, .memo button { background:#2a2f3a; color:var(--fg); border:0; border-radius:10px; padding:8px 12px; font-size:14px; font-weight:600; }
  .mpCallers { padding:10px 14px; border-bottom:1px solid #2a2f3a; font-size:13px; color:var(--dim); }
  .mpCallers input { width:100%; margin-top:4px; background:#0f1115; color:var(--fg); border:1px solid #2a2f3a; border-radius:8px; padding:8px; font-size:15px; }
  #memoList { overflow-y:auto; padding:8px 14px 16px; flex:1; }
  .memo { border-bottom:1px solid #2a2f3a; padding:10px 0; }
  .memo .mh { font-weight:800; font-size:16px; }
  .memo .mh span { color:var(--accent); }
  .memo .ml { color:var(--dim); font-size:14px; margin:2px 0 6px; }
  .memo textarea { width:100%; min-height:54px; background:#0f1115; color:var(--fg); border:1px solid #2a2f3a; border-radius:8px; padding:8px; font-size:15px; font-family:inherit; }
  .memo audio { width:100%; height:36px; margin-top:6px; }
  .memo .mb { display:flex; gap:8px; margin-top:6px; }
  .empty { color:var(--dim); padding:14px 0; }
  body.night .leaflet-tile-pane { filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.9); }
  body.night .leaflet-container { background:#1b1d22; }
  .btn { position:absolute; z-index:1000; right:12px; background:var(--card); color:var(--fg); border:0;
    border-radius:12px; padding:10px 12px; font-size:14px; font-weight:600; }
  #recenter { bottom:calc(70px + env(safe-area-inset-bottom)); display:none; }
  #demoBtn { bottom:calc(20px + env(safe-area-inset-bottom)); }
  #demoBtn.on { background:var(--accent); color:#111; }
  #start { position:absolute; inset:0; z-index:2000; background:var(--bg); display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:16px; padding:24px; text-align:center; }
  #start h1 { margin:0; font-size:34px; }
  #start p { margin:0; color:var(--dim); max-width:340px; line-height:1.4; }
  #start button { background:var(--accent); color:#111; border:0; border-radius:14px; padding:16px 28px;
    font-size:18px; font-weight:700; }
  #start .ghost { background:transparent; color:var(--dim); border:1px solid #2a2f3a; font-size:15px; padding:10px 18px; }
  .arrow { width:28px; height:28px; }
  .arrow svg { width:28px; height:28px; transition:transform .3s; filter:drop-shadow(0 1px 3px rgba(0,0,0,.6)); }
</style>
</head>
<body>
<div id="map"></div>

<div id="top" class="card">
  <div id="dirRow">
    <div id="dir">—</div>
    <div id="dirWord">Heading</div>
    <div id="speedBox" title="Tap to switch units"><span id="speed">0</span> <span id="unit">km/h</span></div>
  </div>
  <div class="section">
    <div class="label">You're on</div>
    <div id="street">—</div>
    <div id="streetSub"></div>
  </div>
  <div class="section">
    <div class="label">Approaching</div>
    <div id="next">—</div>
    <div id="nextDist"></div>
  </div>
  <div id="status">Waiting for GPS…</div>
</div>

<button id="recenter" class="btn">◎ Follow</button>
<button id="demoBtn" class="btn">Demo</button>
<button id="nightBtn" class="btn left">🌙 Night</button>
<button id="memosBtn" class="btn left">Memos</button>
<button id="callerBtn">📣 Me</button>
<button id="memoBtn">🎙 Memo</button>
<div id="recLive"></div>

<div id="memoPanel">
  <div class="mpHead"><b>Memos</b><button id="memoCopy">Copy all</button><button id="memoShare">Share</button><button id="memoClose">✕</button></div>
  <div class="mpCallers">Who can make a call (comma separated, tap 📣 on the map to switch)
    <input id="callerInput" placeholder="Me, Unit 2, Unit 3"></div>
  <div id="memoList"></div>
</div>

<div id="start">
  <h1>Streetwise <span style="font-size:14px;color:var(--dim)">v10</span></h1>
  <p>Shows the street you're on, your speed, and the next cross street ahead. Uses your phone's GPS and OpenStreetMap.</p>
  <button id="go">Start</button>
  <button id="goDemo" class="ghost">Try demo (tap the map to drive)</button>
</div>

<script>
// ---------- settings ----------
const VERSION = "v10";
const TZ = 14;                             // street data is loaded in zoom-14 tiles (~1.5 km squares)
const KEEP_RADIUS = 4000;                  // m: drop squares from memory beyond this
const CACHE_DAYS = 30;                     // squares are saved on the phone this long
const LOOKAHEAD_MAX = 1500;    // m max distance to report a cross street
const AHEAD_ANGLE = 55;        // deg either side of heading counts as "ahead"
const OVERPASS = [
  "https://overpass-api.de/api/interpreter",
  "https://overpass.private.coffee/api/interpreter",
  "https://maps.mail.ru/osm/tools/overpass/api/interpreter",
  "https://overpass.kumi.systems/api/interpreter"
];

// ---------- state ----------
let useMph = false;
try { useMph = localStorage.getItem("sw_mph") === "1"; } catch(e) {}
let follow = true, demo = false;
let pos = null, heading = null, speedMs = 0;
let lastPts = [];              // recent fixes for computed heading/speed
let roads = { ways:[], nodeNames:new Map(), grid:new Map(), addrGrid:new Map() };
const cells = new Map();   // key -> {status, ways, retryAt}
let pumping = false;
let roadMsg = "", gpsMsg = "";

// ---------- geometry (local metres) ----------
const R = 6371000, rad = d => d*Math.PI/180, deg = r => r*180/Math.PI;
function toXY(lat, lon, o){ return [rad(lon-o[1])*R*Math.cos(rad(o[0])), rad(lat-o[0])*R]; }
function dist(a, b){ const p = toXY(b[0],b[1],a); return Math.hypot(p[0],p[1]); }
function bearing(a, b){
  const y = Math.sin(rad(b[1]-a[1]))*Math.cos(rad(b[0]));
  const x = Math.cos(rad(a[0]))*Math.sin(rad(b[0])) - Math.sin(rad(a[0]))*Math.cos(rad(b[0]))*Math.cos(rad(b[1]-a[1]));
  return (deg(Math.atan2(y,x))+360)%360;
}
function closestPt(p, a, b){
  const dx=b[0]-a[0], dy=b[1]-a[1], L2=dx*dx+dy*dy;
  let t = L2 ? ((p[0]-a[0])*dx+(p[1]-a[1])*dy)/L2 : 0; t = Math.max(0,Math.min(1,t));
  return [a[0]+t*dx, a[1]+t*dy];
}
function angDiff(a, b){ let d = Math.abs(a-b)%360; return d>180 ? 360-d : d; }
function segDist(p, a, b){ // p,a,b in xy
  const dx=b[0]-a[0], dy=b[1]-a[1], L2=dx*dx+dy*dy;
  let t = L2 ? ((p[0]-a[0])*dx+(p[1]-a[1])*dy)/L2 : 0; t = Math.max(0,Math.min(1,t));
  return Math.hypot(p[0]-a[0]-t*dx, p[1]-a[1]-t*dy);
}

// ---------- road data (cached ~1 km squares from OpenStreetMap) ----------
const HW = "motorway|trunk|primary|secondary|tertiary|unclassified|residential|living_street|road|service|motorway_link|trunk_link|primary_link|secondary_link|tertiary_link";
const r6 = x => Math.round(x*1e6)/1e6;
const ptKey = p => p[0] + "," + p[1];
function cellOf(ll){
  const n = 2**TZ, la = rad(ll[0]);
  return [Math.floor((ll[1]+180)/360*n), Math.floor((1 - Math.log(Math.tan(la) + 1/Math.cos(la))/Math.PI)/2*n)];
}
function cellKey(c){ return c[0] + ":" + c[1]; }
function tileLat(y){ const n = Math.PI - 2*Math.PI*y/2**TZ; return deg(Math.atan(0.5*(Math.exp(n) - Math.exp(-n)))); }
function tileLon(x){ return x/2**TZ*360 - 180; }
function cellCenter(k){ const [x,y] = k.split(":").map(Number); return [tileLat(y+.5), tileLon(x+.5)]; }
function project(ll, brg, d){
  return [ll[0] + d*Math.cos(rad(brg))/111320, ll[1] + d*Math.sin(rad(brg))/(111320*Math.cos(rad(ll[0])))];
}

// Saved street data lives in IndexedDB (room for a whole city, unlike localStorage)
let dbP = null;
function db(){
  if (!dbP) dbP = new Promise((res, rej) => {
    const r = indexedDB.open("streetwise", 2);
    r.onupgradeneeded = () => {
      if (!r.result.objectStoreNames.contains("tiles")) r.result.createObjectStore("tiles");
      if (!r.result.objectStoreNames.contains("memos")) r.result.createObjectStore("memos", { keyPath:"id" });
    };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  return dbP;
}
async function cacheGet(k){
  try { const d = await db();
    const v = await new Promise(res => { const q = d.transaction("tiles").objectStore("tiles").get(k);
      q.onsuccess = () => res(q.result || null); q.onerror = () => res(null); });
    return v && Date.now() - v.t < CACHE_DAYS*864e5 ? v : null;
  } catch(e){ return null; }
}
async function cachePut(k, data){
  try { const d = await db();
    await new Promise(res => { const tx = d.transaction("tiles","readwrite");
      tx.objectStore("tiles").put({ t:Date.now(), ...data }, k); tx.oncomplete = res; tx.onerror = res; tx.onabort = res; });
  } catch(e){}
}
// free the space used by the old cache format
try { Object.keys(localStorage).filter(x => x.startsWith("sw2_") || x.startsWith("sw_cell_")).forEach(x => localStorage.removeItem(x)); } catch(e){}

// Main source: OpenFreeMap vector tiles (fast CDN, no key). Backup: Overpass servers.
const SKIP_CLASS = new Set(["path","track","ferry","rail","transit","bridleway","pier","aerialway","raceway"]);
let tileTemplate = null;
async function getTemplate(force){
  if (tileTemplate && !force) return tileTemplate;
  try { const c = JSON.parse(localStorage.getItem("sw_tpl") || "null");
        if (!force && c && Date.now() - c.t < 864e5) return (tileTemplate = c.u); } catch(e){}
  const r = await fetch("https://tiles.openfreemap.org/planet");
  if (!r.ok) throw new Error("tile index HTTP " + r.status);
  tileTemplate = (await r.json()).tiles[0];
  try { localStorage.setItem("sw_tpl", JSON.stringify({ t:Date.now(), u:tileTemplate })); } catch(e){}
  return tileTemplate;
}
async function fetchTile(k, retry){
  const [x,y] = k.split(":").map(Number);
  const url = (await getTemplate(retry)).replace("{z}", TZ).replace("{x}", x).replace("{y}", y);
  const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 12000);
  const r = await fetch(url, { signal:ctl.signal }); clearTimeout(to);
  if (r.status === 404 && !retry) return fetchTile(k, true);   // map version rotated
  const ways = [], addrs = [];
  if (r.status === 204 || r.status === 404) return { ways, addrs };   // empty area
  if (!r.ok) throw new Error("HTTP " + r.status);
  const t = decodeTile(new Uint8Array(await r.arrayBuffer()));
  const H = t.layers.housenumber;          // address points, for block numbers
  if (H) for (let i=0; i<H.length; i++){
    const f = H.feature(i), n = parseInt(f.properties.housenumber, 10);
    if (f.type !== 1 || !(n > 0)) continue;
    const g = f.toGeoJSON(x, y, TZ).geometry;
    const c = g.type === "Point" ? g.coordinates : g.coordinates[0];
    addrs.push([r6(c[1]), r6(c[0]), n]);
  }
  const L = t.layers.transportation_name;
  if (!L) return { ways, addrs };
  for (let i=0; i<L.length; i++){
    const f = L.feature(i), p = f.properties;
    const name = p.name || p["name:latin"] || p.name_en;
    if (!name || f.type !== 2 || SKIP_CLASS.has(p.class)) continue;
    const g = f.toGeoJSON(x, y, TZ).geometry;
    const lines = g.type === "LineString" ? [g.coordinates] : g.coordinates;
    lines.forEach((ln, j) => ways.push({ id:"t" + k + "_" + i + "_" + j, name,
      pts:ln.map(c => [r6(c[1]), r6(c[0])]) }));
  }
  return { ways, addrs };
}

async function fetchOverpass(k){
  const [x,y] = k.split(":").map(Number), pad = 0.0008;
  const S = (tileLat(y+1)-pad).toFixed(4), W = (tileLon(x)-pad).toFixed(4),
        N = (tileLat(y)+pad).toFixed(4), E = (tileLon(x+1)+pad).toFixed(4);
  const q = `[out:json][timeout:12][maxsize:8000000];way["highway"~"^(${HW})$"]["name"](${S},${W},${N},${E});out geom qt;`;
  const errors = [];
  for (const url of OVERPASS){
    const host = new URL(url).host.split(".")[0];
    try {
      const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 15000);
      const r = await fetch(url + "?data=" + encodeURIComponent(q), { signal:ctl.signal });
      clearTimeout(to);
      if (!r.ok) throw new Error("HTTP " + r.status);
      const j = await r.json();
      const ways = [];
      for (const el of j.elements)
        if (el.type === "way" && el.geometry && el.tags && el.tags.name)
          ways.push({ id:el.id, name:el.tags.name, pts:el.geometry.map(g => [r6(g.lat), r6(g.lon)]) });
      return { ways, addrs:[] };
    } catch(e){ errors.push(host + ": " + (e.name === "AbortError" ? "timeout" : e.message)); }
  }
  throw new Error(errors.join("; "));
}

async function fetchCell(k){
  let first;
  try { return await fetchTile(k); }
  catch(e){ first = "openfreemap: " + (e.name === "AbortError" ? "timeout" : e.message); }
  try { return await fetchOverpass(k); }
  catch(e){ throw new Error(first + "; " + e.message); }
}

function neededCells(){
  if (!pos) return [];
  const pts = [pos];
  for (const b of [0,90,180,270]) pts.push(project(pos, b, 250));      // edges of the square you're in
  if (heading != null) for (const d of [500, 1000, 1500]) pts.push(project(pos, heading, d)); // ahead
  const keys = [];
  for (const p of pts){ const k = cellKey(cellOf(p)); if (!keys.includes(k)) keys.push(k); }
  return keys;
}

async function pump(){
  if (pumping) return; pumping = true;
  try {
    while (true){
      const k = neededCells().find(k => { const c = cells.get(k);
        return !c || (c.status === "fail" && Date.now() > c.retryAt); });
      if (!k) break;
      cells.set(k, { status:"loading" });
      const cached = await cacheGet(k);
      if (cached){ cells.set(k, { status:"ok", ways:cached.ways, addrs:cached.addrs || [] }); rebuild(); continue; }
      setRoadMsg("Loading streets…");
      try {
        const d = await fetchCell(k);
        cells.set(k, { status:"ok", ways:d.ways, addrs:d.addrs });
        cachePut(k, d);
        rebuild();
      } catch(e){
        cells.set(k, { status:"fail", retryAt:Date.now() + 15000 });
        setRoadMsg("Street data failed (" + e.message + ") — retrying");
        break;
      }
    }
  } finally { pumping = false; }
}
setInterval(() => { if (pos) pump(); }, 5000);

function rebuild(){
  for (const [k, c] of cells) if (pos && dist(pos, cellCenter(k)) > KEEP_RADIUS) cells.delete(k);
  const seen = new Set(), ways = [], nodeNames = new Map();
  for (const c of cells.values()){
    if (c.status !== "ok") continue;
    for (const w of c.ways){
      if (seen.has(w.id)) continue; seen.add(w.id); ways.push(w);
      for (const p of w.pts){
        const key = ptKey(p);
        if (!nodeNames.has(key)) nodeNames.set(key, new Set());
        nodeNames.get(key).add(w.name);
      }
    }
  }
  // spatial index of every road segment, for finding crossings (incl. overpasses)
  const grid = new Map();
  for (const w of ways) for (let i=0; i<w.pts.length-1; i++){
    const a = w.pts[i], b = w.pts[i+1];
    for (const k of bucketsFor(a, b)){
      if (!grid.has(k)) grid.set(k, []);
      grid.get(k).push([w, i]);
    }
  }
  const addrGrid = new Map();
  for (const c of cells.values()) if (c.status === "ok") for (const a of c.addrs || []){
    const k = Math.floor(a[0]/GB_LAT) + ":" + Math.floor(a[1]/GB_LON);
    if (!addrGrid.has(k)) addrGrid.set(k, []);
    addrGrid.get(k).push(a);
  }
  roads = { ways, nodeNames, grid, addrGrid };
  lastName = null;
  const ok = [...cells.values()].filter(c => c.status === "ok").length;
  setRoadMsg(`${ok} area${ok === 1 ? "" : "s"} of streets ready`);
  update();
}

// Fallback: if the street map can't load, at least get the current street name

  lastNominatim = Date.now();

    const j = await r.json();

}

// ---------- core logic ----------
function currentStreet(){
  if (!pos || !roads.ways.length) return null;
  const p = [0,0];
  let best = null;
  for (const w of roads.ways){
    for (let i=0; i<w.pts.length-1; i++){
      const A = w.pts[i], B = w.pts[i+1];
      const d = segDist(p, toXY(A[0],A[1],pos), toXY(B[0],B[1],pos));
      if (d > 60) continue;
      let score = d;
      if (heading != null){
        // prefer segments running the way you're travelling (either direction)
        const sb = bearing(A,B), diff = Math.min(angDiff(sb,heading), angDiff((sb+180)%360,heading));
        score += (diff/90)*20;
      }
      if (!best || score < best.score) best = { score, d, way:w };
    }
  }
  return best;
}

const GB_LAT = 0.001, GB_LON = 0.0015;   // ~110 m buckets
function bucketsFor(a, b){
  const i0 = Math.floor(Math.min(a[0],b[0])/GB_LAT), i1 = Math.floor(Math.max(a[0],b[0])/GB_LAT);
  const j0 = Math.floor(Math.min(a[1],b[1])/GB_LON), j1 = Math.floor(Math.max(a[1],b[1])/GB_LON);
  const out = [];
  for (let i=i0; i<=i1; i++) for (let j=j0; j<=j1; j++) out.push(i + ":" + j);
  return out;
}
function segIntersect(p1, p2, p3, p4){ // xy points; returns intersection xy or null
  const d = (p2[0]-p1[0])*(p4[1]-p3[1]) - (p2[1]-p1[1])*(p4[0]-p3[0]);
  if (Math.abs(d) < 1e-9) return null;
  const t = ((p3[0]-p1[0])*(p4[1]-p3[1]) - (p3[1]-p1[1])*(p4[0]-p3[0])) / d;
  const u = ((p3[0]-p1[0])*(p2[1]-p1[1]) - (p3[1]-p1[1])*(p2[0]-p1[0])) / d;
  const e = 1e-6;
  if (t < -e || t > 1+e || u < -e || u > 1+e) return null;
  return [p1[0] + t*(p2[0]-p1[0]), p1[1] + t*(p2[1]-p1[1])];
}

function approaching(name){
  if (!pos || heading == null || !name) return null;
  const hits = [];   // {d, ll, name}
  const consider = (d, ll, other) => {
    if (d < 12 || d > LOOKAHEAD_MAX || other === name) return;
    if (angDiff(bearing(pos, ll), heading) > (d < 100 ? 75 : AHEAD_ANGLE)) return;   // wider when close (curves)
    hits.push({ d, ll, name:other });
  };
  const toLL = xy => [pos[0] + deg(xy[1]/R), pos[1] + deg(xy[0]/(R*Math.cos(rad(pos[0]))))];
  const checked = new Set();
  for (const w of roads.ways){
    if (w.name !== name) continue;
    // 1) streets that connect to yours
    for (const p of w.pts){
      const names = roads.nodeNames.get(ptKey(p));
      if (names && names.size > 1) for (const n of names) consider(dist(pos, p), p, n);
    }
    // 2) any named road crossing your path (bridges / underpasses too)
    for (let i=0; i<w.pts.length-1; i++){
      const A = w.pts[i], B = w.pts[i+1];
      if (Math.min(dist(pos, A), dist(pos, B)) > LOOKAHEAD_MAX + 1000) continue;
      const a = toXY(A[0],A[1],pos), b = toXY(B[0],B[1],pos);
      const pd = 0.00015;   // look a little beyond the segment for nearby street ends
      for (const k of bucketsFor([Math.min(A[0],B[0])-pd, Math.min(A[1],B[1])-pd*1.5], [Math.max(A[0],B[0])+pd, Math.max(A[1],B[1])+pd*1.5])){
        for (const [o, j] of roads.grid.get(k) || []){
          if (o.name === name) continue;
          const id = w.id + "/" + i + "|" + o.id + "/" + j;
          if (checked.has(id)) continue; checked.add(id);
          const C = o.pts[j], D = o.pts[j+1];
          const x = segIntersect(a, b, toXY(C[0],C[1],pos), toXY(D[0],D[1],pos));
          if (x) consider(Math.hypot(x[0], x[1]), toLL(x), o.name);
          // T-junction: a street that ends at yours. Map simplification can leave a gap of a few metres.
          for (const E of [j === 0 ? C : null, j === o.pts.length-2 ? D : null]){
            if (!E) continue;
            const ex = toXY(E[0],E[1],pos), cp = closestPt(ex, a, b);
            if (Math.hypot(ex[0]-cp[0], ex[1]-cp[1]) < 12) consider(Math.hypot(cp[0], cp[1]), toLL(cp), o.name);
          }
        }
      }
    }
  }
  if (!hits.length) return null;
  hits.sort((p, q) => p.d - q.d);
  const best = hits[0];
  const names = [...new Set(hits.filter(h => h.d - best.d < 40).map(h => h.name))];
  return { d:best.d, ll:best.ll, names };
}

// ---------- block number ----------
function around(p, m){ const dLa = m/111320, dLo = m/(111320*Math.cos(rad(p[0]))); return bucketsFor([p[0]-dLa, p[1]-dLo], [p[0]+dLa, p[1]+dLo]); }
// the street a house faces: nearest street, but only if it's clearly nearer than any other (corner houses are ambiguous)
function nearestStreetTo(p){
  const byName = new Map();
  for (const k of around(p, 80)) for (const [w, i] of roads.grid.get(k) || []){
    const A = w.pts[i], B = w.pts[i+1], d = segDist([0,0], toXY(A[0],A[1],p), toXY(B[0],B[1],p));
    if (!byName.has(w.name) || d < byName.get(w.name)) byName.set(w.name, d);
  }
  const r = [...byName.entries()].sort((x, y) => x[1] - y[1]);
  if (!r.length) return null;
  return r.length === 1 || r[1][1] - r[0][1] > 8 ? r[0][0] : null;
}
function blockOf(name){
  const near = [];
  for (const k of around(pos, 70)) for (const a of roads.addrGrid.get(k) || []){
    const d = dist(pos, a); if (d <= 70) near.push({ a, d });
  }
  near.sort((p, q) => p.d - q.d);
  // nearest few houses that actually face this street (skips corner houses numbered on the cross street)
  const votes = new Map(); let used = 0;
  for (const { a } of near.slice(0, 14)){
    if (nearestStreetTo(a) !== name) continue;
    const b = Math.floor(a[2]/100)*100; votes.set(b, (votes.get(b) || 0) + (3 - used));
    if (++used >= 3) break;
  }
  if (!votes.size) return null;
  return [...votes.entries()].sort((p, q) => q[1] - p[1])[0][0];
}

// ---------- voice memos ----------
// Each memo: audio + live transcript (when the phone allows) + time, caller, and where you were when it started.
async function memoStore(mode){ const d = await db(); return d.transaction("memos", mode).objectStore("memos"); }
async function memoPut(m){ try { const st = await memoStore("readwrite"); await new Promise(r => { const q = st.put(m); q.onsuccess = r; q.onerror = r; }); } catch(e){} }
async function memoDel(id){ try { const st = await memoStore("readwrite"); await new Promise(r => { const q = st.delete(id); q.onsuccess = r; q.onerror = r; }); } catch(e){} }
async function memoAll(){ try { const st = await memoStore("readonly");
  return await new Promise(r => { const q = st.getAll(); q.onsuccess = () => r(q.result || []); q.onerror = () => r([]); }); } catch(e){ return []; } }

let rec = null, recStream = null, recChunks = [], recStamp = null, recTimer = null, recog = null, recText = "";
const pad2 = n => String(n).padStart(2, "0");
const hhmmss = t => { const d = new Date(t); return `${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`; };
const BOUND = h => h == null ? "" : ["NB","EB","SB","WB"][Math.round(h/90) % 4];

function snapshot(){
  const nextTxt = $("next").textContent, ok = nextTxt && !/^(—|Start moving…|Needs street data)$/.test(nextTxt);
  return { t:Date.now(), caller:callers[callerIdx], ll:pos ? [r6(pos[0]), r6(pos[1])] : null,
    street:$("street").textContent, block:$("streetSub").textContent, dir:BOUND(heading),
    next: ok ? nextTxt : "", nextDist: ok ? $("nextDist").textContent : "" };
}
function locLine(m){
  let s = m.street && m.street !== "—" ? m.street : "Unknown location";
  if (m.block) s += ` (${m.block})`;
  if (m.dir) s += ` ${m.dir}`;
  if (m.next) s += `, approaching ${m.next}` + (m.nextDist ? ` ${m.nextDist}` : "");
  return s;
}

async function startMemo(){
  if (!navigator.mediaDevices || !window.MediaRecorder){ flashMemo("Recording not supported here"); return; }
  try { recStream = await navigator.mediaDevices.getUserMedia({ audio:true }); }
  catch(e){ flashMemo("Microphone blocked"); return; }
  const type = ["audio/mp4", "audio/webm;codecs=opus", "audio/webm"].find(t => MediaRecorder.isTypeSupported(t));
  rec = new MediaRecorder(recStream, type ? { mimeType:type } : undefined);
  recChunks = []; rec.ondataavailable = e => { if (e.data && e.data.size) recChunks.push(e.data); };
  rec.onstop = finishMemo;
  rec.start(1000);
  recStamp = snapshot();
  $("memoBtn").classList.add("rec");
  const tick = () => { const s = Math.round((Date.now() - recStamp.t)/1000); $("memoBtn").textContent = `■ Stop ${Math.floor(s/60)}:${pad2(s%60)}`; };
  tick(); recTimer = setInterval(tick, 500);
  startTranscribe();
}
function startTranscribe(){
  recText = ""; $("recLive").textContent = "Listening…"; $("recLive").classList.add("on");
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR){ $("recLive").textContent = "Recording (no live transcript on this phone)"; return; }
  let finals = "";
  try {
    recog = new SR(); recog.lang = "en-CA"; recog.continuous = true; recog.interimResults = true;
    recog.onresult = e => {
      let interim = "";
      for (let i = e.resultIndex; i < e.results.length; i++){
        const r = e.results[i]; if (r.isFinal) finals += r[0].transcript.trim() + " "; else interim += r[0].transcript;
      }
      recText = (finals + interim).trim(); $("recLive").textContent = recText || "Listening…";
    };
    recog.onerror = () => {};
    recog.onend = () => { if (rec && rec.state === "recording") try { recog.start(); } catch(e){} };   // keep going on long memos
    recog.start();
  } catch(e){ recog = null; $("recLive").textContent = "Recording (transcript unavailable)"; }
}
function stopMemo(){
  if (!rec || rec.state !== "recording") return;
  clearInterval(recTimer);
  $("memoBtn").textContent = "Saving…";
  if (recog){ const r = recog; recog = null; r.onend = null; try { r.stop(); } catch(e){} }
  setTimeout(() => { try { rec.stop(); } catch(e){ finishMemo(); } }, 700);   // give the transcript a moment to finish
}
async function finishMemo(){
  if (recStream) recStream.getTracks().forEach(t => t.stop());
  const blob = recChunks.length ? new Blob(recChunks, { type:(rec && rec.mimeType) || "audio/mp4" }) : null;
  const m = { id:recStamp.t, ...recStamp, dur:Math.round((Date.now() - recStamp.t)/1000), text:recText, audio:blob };
  rec = null; recStream = null; recChunks = [];
  await memoPut(m);
  $("memoBtn").classList.remove("rec"); $("memoBtn").textContent = "🎙 Memo";
  $("recLive").classList.remove("on");
  flashMemo("Memo saved ✓");
  updateMemoCount();
  if ($("memoPanel").classList.contains("open")) renderMemos();
}
function flashMemo(t){ const b = $("memosBtn"); b.textContent = t; setTimeout(updateMemoCount, 2000); }
async function updateMemoCount(){ const n = (await memoAll()).length; $("memosBtn").textContent = n ? `Memos (${n})` : "Memos"; }

let audioURLs = [];
async function renderMemos(){
  audioURLs.forEach(u => URL.revokeObjectURL(u)); audioURLs = [];
  const list = $("memoList"), memos = (await memoAll()).sort((a, b) => b.t - a.t);
  list.innerHTML = "";
  if (!memos.length){ list.innerHTML = '<div class="empty">No memos yet. Tap 🎙 Memo on the map, talk, then tap Stop.</div>'; return; }
  for (const m of memos){
    const el = document.createElement("div"); el.className = "memo";
    const h = document.createElement("div"); h.className = "mh";
    h.textContent = hhmmss(m.t) + " — "; const c = document.createElement("span"); c.textContent = m.caller; h.append(c);
    const l = document.createElement("div"); l.className = "ml"; l.textContent = locLine(m);
    const ta = document.createElement("textarea"); ta.value = m.text || ""; ta.placeholder = "Type or correct what was said…";
    ta.onchange = () => { m.text = ta.value; memoPut(m); };
    el.append(h, l, ta);
    if (m.audio){ const a = document.createElement("audio"); a.controls = true; a.preload = "metadata";
      const u = URL.createObjectURL(m.audio); audioURLs.push(u); a.src = u; el.append(a); }
    const bar = document.createElement("div"); bar.className = "mb";
    if (m.audio && navigator.canShare){
      const sh = document.createElement("button"); sh.textContent = "Share audio";
      sh.onclick = async () => {
        const ext = (m.audio.type || "").includes("webm") ? "webm" : "m4a";
        const f = new File([m.audio], `memo-${new Date(m.t).toISOString().slice(0,19).replace(/[T:]/g, "-")}.${ext}`, { type:m.audio.type });
        try { if (navigator.canShare({ files:[f] })) await navigator.share({ files:[f], title:"Memo " + hhmmss(m.t) }); } catch(e){}
      };
      bar.append(sh);
    }
    const del = document.createElement("button"); del.textContent = "Delete"; let armed = false;
    del.onclick = async () => { if (!armed){ armed = true; del.textContent = "Tap again to delete"; setTimeout(() => { armed = false; del.textContent = "Delete"; }, 2500); return; }
      await memoDel(m.id); renderMemos(); updateMemoCount(); };
    bar.append(del); el.append(bar);
    list.append(el);
  }
}
async function memoText(){
  const memos = (await memoAll()).sort((a, b) => a.t - b.t);
  if (!memos.length) return "";
  const day = new Date(memos[0].t).toLocaleDateString("en-CA");
  return `Surveillance memos — ${day}\n\n` + memos.map(m =>
    `${hhmmss(m.t)} — ${m.caller} — ${locLine(m)}\n  ${m.text ? `"${m.text}"` : "(audio only, no transcript)"}`).join("\n\n");
}
async function copyMemos(){
  const text = await memoText(), btn = $("memoCopy");
  const done = ok => { btn.textContent = ok ? "Copied ✓" : "Copy failed"; setTimeout(() => btn.textContent = "Copy all", 1800); };
  const fallback = () => { const ta = document.createElement("textarea"); ta.value = text; document.body.append(ta); ta.select();
    let ok = false; try { ok = document.execCommand("copy"); } catch(e){} ta.remove(); done(ok); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => done(true), fallback); else fallback();
}
async function shareMemos(){
  const text = await memoText();
  try {
    if (navigator.share) await navigator.share({ title:"Surveillance memos", text });
    else copyMemos();
  } catch(e){}
}

// ---------- night mode ----------
function setNight(on){
  document.body.classList.toggle("night", on);
  $("nightBtn").textContent = on ? "☀︎ Day" : "🌙 Night";
  try { localStorage.setItem("sw_night", on ? "1" : "0"); } catch(e){}
}

function streetGeometry(name){
  const lines = [];
  for (const w of roads.ways) if (w.name === name)
    lines.push(w.pts);
  return lines;
}

let lastName = null;
function update(){
  if (!pos) return;
  // speed
  const v = useMph ? speedMs*2.23694 : speedMs*3.6;
  $("speed").textContent = Math.round(v < 1.5 ? 0 : v);
  $("unit").textContent = useMph ? "mph" : "km/h";

  // compass direction of travel
  if (heading != null){
    const i = Math.round(heading/45) % 8;
    $("dir").textContent = ["N","NE","E","SE","S","SW","W","NW"][i];
    $("dirWord").textContent = ["North","Northeast","East","Southeast","South","Southwest","West","Northwest"][i];
  } else { $("dir").textContent = "—"; $("dirWord").textContent = "Heading"; }

  // marker + map
  me.setLatLng(pos); if (!map.hasLayer(me)) me.addTo(map);
  const svg = me.getElement() && me.getElement().querySelector("svg");
  if (svg) svg.style.transform = `rotate(${heading ?? 0}deg)`;
  if (follow) map.panTo(pos, { animate:true });

  // fetch roads if needed
  pump();

  const cur = currentStreet();
  if (cur){
    const name = cur.way.name;
    $("street").textContent = name;
    const blk = blockOf(name);
    $("streetSub").textContent = blk != null ? `${blk} block` : "";
    if (name !== lastName){
      streetLine.setLatLngs(streetGeometry(name)); if (!map.hasLayer(streetLine)) streetLine.addTo(map);
      lastName = name;
    }
    const nx = approaching(name);
    if (nx){
      $("next").textContent = nx.names.join(" / ");
      $("nextDist").textContent = fmtDist(nx.d);
      nextMarker.setLatLng(nx.ll); if (!map.hasLayer(nextMarker)) nextMarker.addTo(map);
    } else {
      $("next").textContent = heading == null ? "Start moving…" : "—";
      $("nextDist").textContent = "";
      if (map.hasLayer(nextMarker)) map.removeLayer(nextMarker);
    }
  } else if (roads.ways.length){
    $("street").textContent = "Off road"; $("streetSub").textContent = "";
    $("next").textContent = "—"; $("nextDist").textContent = "";
  } else {
    nominatimName();
    $("street").textContent = fallbackName || "—"; $("streetSub").textContent = "";
    $("next").textContent = "Needs street data";
    $("nextDist").textContent = "";
  }
}

function fmtDist(m){
  if (useMph){ const ft = m*3.28084; return ft < 1000 ? `${Math.round(ft/10)*10} ft` : `${(m/1609.34).toFixed(1)} mi`; }
  return m < 1000 ? `${Math.round(m/10)*10} m` : `${(m/1000).toFixed(1)} km`;
}
function setStatus(t){ gpsMsg = t; renderStatus(); }
function setRoadMsg(t){ roadMsg = t; renderStatus(); }
function renderStatus(){ $("status").textContent = [gpsMsg, roadMsg].filter(Boolean).join(" · "); }

// ---------- GPS ----------
function onFix(p){
  if (demo) return;
  const c = p.coords, here = [c.latitude, c.longitude], t = p.timestamp;
  lastPts.push({ ll:here, t }); while (lastPts.length > 6) lastPts.shift();
  // speed: device value if present, else derived
  if (c.speed != null && !isNaN(c.speed)) speedMs = c.speed;
  else if (lastPts.length >= 2){
    const a = lastPts[lastPts.length-2], dt = (t-a.t)/1000;
    if (dt > 0) speedMs = dist(a.ll, here)/dt;
  }
  // heading: device value when moving, else from recent movement
  if (c.heading != null && !isNaN(c.heading) && speedMs > 1) heading = c.heading;
  else {
    const first = lastPts.find(q => dist(q.ll, here) > 8);
    if (first) heading = bearing(first.ll, here);
  }
  pos = here;
  setStatus(`GPS ±${Math.round(c.accuracy)} m`);
  update();
}
function onErr(e){
  setStatus(e.code === 1 ? "Location permission denied — enable it in browser settings"
    : "GPS unavailable: " + e.message);
}

async function keepAwake(){
  try { if ("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen"); } catch(e) {}
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && !demo) keepAwake(); });

function start(){
  $("start").style.display = "none";
  if (!("geolocation" in navigator)){ setStatus("This browser has no GPS access"); return; }
  if (!window.isSecureContext) setStatus("Needs https:// to use GPS");
  navigator.geolocation.watchPosition(onFix, onErr, { enableHighAccuracy:true, maximumAge:0, timeout:15000 });
  keepAwake();
  map.setZoom(17);
}

// ---------- demo mode: tap the map to "drive" ----------
function setDemo(on){
  demo = on;
  $("demoBtn").classList.toggle("on", on);
  $("demoBtn").textContent = on ? "Demo on" : "Demo";
  if (on){ setStatus("Demo: tap the map to move along a street"); speedMs = 0; }
}
map.on("click", e => {
  if (!demo) return;
  const ll = [e.latlng.lat, e.latlng.lng];
  if (pos && dist(pos, ll) > 3){ heading = bearing(pos, ll); speedMs = 13.9; }
  pos = ll; follow = false;
  update();
});

// ---------- controls ----------
$("go").onclick = start;
$("goDemo").onclick = () => { $("start").style.display = "none"; setDemo(true);
  pos = map.getCenter(); pos = [pos.lat, pos.lng]; update(); };
$("demoBtn").onclick = () => setDemo(!demo);
$("speedBox").onclick = () => { useMph = !useMph; try { localStorage.setItem("sw_mph", useMph?"1":"0"); } catch(e){} update(); };
$("recenter").onclick = () => { follow = true; $("recenter").style.display = "none"; if (pos) map.setView(pos, Math.max(map.getZoom(),16)); };
$("nightBtn").onclick = () => setNight(!document.body.classList.contains("night"));
$("memoBtn").onclick = () => (rec && rec.state === "recording") ? stopMemo() : startMemo();
$("callerBtn").onclick = () => { callerIdx = (callerIdx + 1) % callers.length; saveCallers(); showCaller(); };
$("memosBtn").onclick = () => { $("callerInput").value = callers.join(", "); $("memoPanel").classList.add("open"); renderMemos(); };
$("memoClose").onclick = () => $("memoPanel").classList.remove("open");
$("memoCopy").onclick = copyMemos;
$("memoShare").onclick = shareMemos;
$("callerInput").onchange = () => {
  const list = $("callerInput").value.split(",").map(x => x.trim()).filter(Boolean);
  callers = list.length ? list : ["Me"]; if (callerIdx >= callers.length) callerIdx = 0; saveCallers(); showCaller();
};
showCaller(); updateMemoCount();
{ let n = null; try { n = localStorage.getItem("sw_night"); } catch(e){}
  const h = new Date().getHours();
  setNight(n === null ? (h >= 18 || h < 7) : n === "1"); }
</script>
